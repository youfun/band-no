name: Build ARM64 APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: test and assemble arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :decision:test --stacktrace

      - name: Assemble arm64-v8a release APK
        run: ./gradlew :app:assembleRelease -PabiFilters=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BandNo-${{ github.sha }}-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
