name: Build ARM64 APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: test and assemble arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :decision:test --stacktrace

      - name: Assemble arm64-v8a release APK
        run: ./gradlew :app:assembleRelease -PabiFilters=arm64-v8a --stacktrace

      - name: Name APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BandNo-${VER}-arm64-v8a.apk"
          echo "VERSION=${VER}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandNo-${{ env.VERSION }}-arm64-v8a
          path: dist/BandNo-*-arm64-v8a.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BandNo-*-arm64-v8a.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
